<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#181c1a">

    <title>Govt. Debendra College</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="page">

        <!-- Top Buttons -->
        <div class="top-actions">

            <button
                class="top-btn"
                id="supportBtn"
                type="button"
                aria-label="Support"
            >
                <i class="fa-solid fa-headset"></i>
            </button>

            <button
                class="top-btn"
                id="loginBtn"
                type="button"
                aria-label="Login"
            >
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>

        </div>


        <!-- Student Card -->
        <section class="student-card">

            <!-- Banner -->
            <div class="banner">
                <img
                    src="assets/banner.png"
                    alt="Govt. Debendra College"
                >
            </div>


            <!-- Profile Information -->
            <div class="profile-section">

                <div class="profile-image-wrap">
                    <img
                        src="assets/profile.jpeg"
                        alt="Student profile"
                        class="profile-image"
                    >
                </div>

                <div class="student-info">

                    <h1>Miqdad Khan</h1>

                    <div class="info-row">
                        <span>Class:</span>
                        <strong>XI-XII</strong>
                    </div>

                    <div class="info-row">
                        <span>Roll:</span>
                        <strong>242562253</strong>
                    </div>

                    <div class="info-row">
                        <span>Group:</span>
                        <strong>Humanities</strong>
                    </div>

                    <div class="info-row">
                        <span>Validity:</span>
                        <strong>2027</strong>
                    </div>

                </div>

            </div>


            <!-- Notice -->
            <div class="notice-section">

                <div class="notice-title">
                    Student Notice
                </div>

                <div class="notice-content">
                    Nothing here yet.
                </div>

            </div>


            <!-- Contact Buttons -->
            <nav class="contact-actions">

                <!-- Website -->
                <a
                    href="https://www.debendracollege.gov.bd"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-btn"
                    aria-label="College Website"
                >
                    <i class="fa-solid fa-globe"></i>
                </a>


                <!-- Google Location -->
                <a
                    href="https://share.google/AJEbPQqivR3y1yeP6"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-btn"
                    aria-label="College Location"
                >
                    <i class="fa-solid fa-location-dot"></i>
                </a>


                <!-- Email -->
                <a
                    href="mailto:debendracollege@gmail.com"
                    class="action-btn"
                    aria-label="Email College"
                >
                    <i class="fa-regular fa-envelope"></i>
                </a>


                <!-- Call -->
                <a
                    href="tel:02996610404"
                    class="action-btn"
                    aria-label="Call College"
                >
                    <i class="fa-solid fa-phone"></i>
                </a>

            </nav>


            <!-- Footer -->
            <footer>
                Business CardBD • Powered by
                <span>Pixasoft</span>
            </footer>

        </section>

    </main>


    <!-- Snackbar -->
    <div id="snackbar" role="status" aria-live="polite">
        <i class="fa-solid fa-circle-info"></i>
        <span id="snackbarText">
            This feature is currently under development.
        </span>
    </div>


    <script src="script.js"></script>

</body>
</html>
